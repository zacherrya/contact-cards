<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Zacherrya Gibson — Mediant Technologies</title>
<meta name="description" content="Contact card for Zacherrya Gibson, Founder, Mediant Technologies.">
<link rel="apple-touch-icon" href="photo.jpg">
<link rel="icon" href="photo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Mediant: the logo's blue, black and saffron; the gold is the i's deep gold, dark enough for small type */
  :root{
    --blue:#1D78C8; --blue-deep:#155996; --black:#191C22; --saffron:#EE9F01; --gold:#B8780C;
    --paper:#FFFFFF; --wash:#ECEEF2; --muted:#626874; --line:#E2E5EB;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--wash);
    font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--black);
    display:flex; justify-content:center; align-items:flex-start;   /* the card fits its content, not the screen */
    padding:24px 16px calc(28px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  .card{
    width:100%; max-width:400px; background:var(--paper);
    border-radius:20px; overflow:hidden;
    box-shadow:0 1px 2px rgba(25,28,34,.06), 0 12px 32px rgba(25,28,34,.14);
  }
  /* the gradient block field from the business card: blue -> the logo's black -> saffron */
  .hero{
    height:108px; position:relative;
    background:#191C22 url("header.jpg") center/cover no-repeat;
  }
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--saffron)}
  .avatar{
    width:132px;height:132px;border-radius:50%;display:block;margin:-70px auto 0;
    position:relative; z-index:2;
    object-fit:cover;object-position:50% 40%;border:5px solid var(--paper);background:var(--black);
    box-shadow:0 6px 20px rgba(25,28,34,.25);
  }
  .who{text-align:center;padding:16px 24px 4px}
  h1{font-size:25px;line-height:1.15;font-weight:600;letter-spacing:-.2px;color:var(--black);margin:0}
  .role{margin:9px 0 0;font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
  .org{margin:10px 0 0;font-size:14px;font-weight:500;color:var(--muted)}
  .tag{margin:4px 0 0;font-size:12.5px;font-weight:400;color:#8A909C}
  .actions{padding:20px 24px 4px}
  .save{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;padding:15px 18px;border-radius:12px;border:0;
    background:linear-gradient(180deg,var(--blue) 0%,var(--blue-deep) 100%);color:#fff;
    font:inherit;font-size:15px;font-weight:600;letter-spacing:.2px;
    text-decoration:none;cursor:pointer;
    box-shadow:0 4px 14px rgba(29,120,200,.30);
  }
  .save:active{transform:translateY(1px)}
  .save svg{width:18px;height:18px;flex:none}
  .rows{padding:18px 24px 4px;display:grid;gap:10px}
  .row{
    display:flex;align-items:center;gap:13px;
    padding:13px 15px;border:1px solid var(--line);border-radius:12px;
    text-decoration:none;color:inherit;background:#FBFBFC;
  }
  .row:active{background:#F2F4F7}
  .ic{
    width:34px;height:34px;flex:none;border-radius:9px;background:rgba(29,120,200,.09);
    display:flex;align-items:center;justify-content:center;
  }
  .ic svg{width:17px;height:17px;stroke:var(--blue)}
  .row .lbl{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8A909C}
  .row .val{font-size:15px;font-weight:500;color:var(--black);overflow-wrap:break-word;line-height:1.3}
  .row.mail .val{font-size:14px}
  .foot{padding:26px 24px 26px;text-align:center}
  .foot img{width:210px;height:auto;display:block;margin:0 auto}
  .hint{margin:16px 0 0;font-size:11px;color:#9AA0AB;letter-spacing:.02em}
  @media (max-width:360px){ h1{font-size:22px} .avatar{width:116px;height:116px;margin-top:-62px} }
</style>
</head>
<body>
  <main class="card">
    <div class="hero"></div>
    <img class="avatar" src="photo.jpg" alt="Zacherrya Gibson">
    <div class="who">
      <h1>Zacherrya Gibson</h1>
      <p class="role">Founder</p>
      <p class="org">Mediant Technologies</p>
      <p class="tag">Better systems. Better decisions.</p>
    </div>

    <div class="actions">
      <a class="save" href="zacherrya.vcf" download="Zacherrya-Gibson.vcf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/>
        </svg>
        Save contact
      </a>
    </div>

    <div class="rows">
      <a class="row" href="tel:+919825363903">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg></span>
        <span><span class="lbl">Phone</span><br><span class="val">+91 98253 63903</span></span>
      </a>
      <a class="row mail" href="mailto:marketing@mediant-tech.in">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="m2.5 6.5 9.5 7 9.5-7"/></svg></span>
        <span><span class="lbl">Email</span><br><span class="val">marketing@mediant-tech.in</span></span>
      </a>
    </div>

    <div class="foot">
      <img src="logo.png" alt="Mediant Technologies">
      <p class="hint">Tap Save contact to add Zacherrya to your phone, photo included.</p>
    </div>
  </main>
</body>
</html>
